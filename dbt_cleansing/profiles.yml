dbt_cleansing:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: projeto-sql-492802
      dataset: dbt_cleansing
      location: US
      threads: 4
      job_execution_timeout_seconds: 300

    ci:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GCP_KEYFILE') }}"
      project: projeto-sql-492802
      dataset: dbt_cleansing_ci
      location: US
      threads: 4
      job_execution_timeout_seconds: 300
